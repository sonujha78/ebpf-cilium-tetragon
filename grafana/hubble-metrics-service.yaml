apiVersion: v1
kind: Service
metadata:
  name: hubble-metrics
  namespace: kube-system
  labels:
    k8s-app: hubble
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9965"
spec:
  clusterIP: None
  selector:
    k8s-app: cilium
  ports:
    - name: hubble-metrics
      port: 9965
      protocol: TCP
      targetPort: 9965
